name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src scripts tests examples

      - name: Run tests
        run: uv run pytest -q
